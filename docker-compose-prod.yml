services:
  php-fpm:
    build:
      context: .
      dockerfile: docker/common/php-fpm/Dockerfile
      tags:
        - ${REGISTRY}/heimdallr-php-fpm:${TAG}
        - ${REGISTRY}/heimdallr-php-fpm:latest
    image: ${REGISTRY}/heimdallr-php-fpm
    volumes:
      - heimdallr_public:/var/www/public
      - heimdallr_storage:/var/www/storage:rw
    networks:
      - heimdallr
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == ${DOCKER_NODE}
    secrets:
      - source: heimdallr_env
        target: /var/www/.env
        mode: 0400
        uid: '33'
        gid: '33'

  web:
    build:
      context: .
      dockerfile: ./docker/production/nginx/Dockerfile
      tags:
        - ${REGISTRY}/heimdallr-web:${TAG}
        - ${REGISTRY}/heimdallr-web:latest
    image: ${REGISTRY}/heimdallr-web
    volumes:
      - heimdallr_public:/var/www/public
      - heimdallr_storage:/var/www/storage:ro
    networks:
      - heimdallr
    ports:
      - 8080:80
    depends_on:
      - php-fpm
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == ${DOCKER_NODE}

networks:
  heimdallr:

volumes:
    heimdallr_public:
      external: true
    heimdallr_storage:
      external: true

secrets:
    heimdallr_env:
        external: true

